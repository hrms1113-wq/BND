<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<title>SPACE EXPLORER - Alien Battle</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;

}


canvas{

    display:block;

}


/* UI */

#ui{

    position:absolute;

    top:20px;
    left:20px;

    color:white;

    font-size:24px;

    z-index:2;

}


#title{

    position:absolute;

    top:20px;

    width:100%;

    text-align:center;

    color:#70eaff;

    font-size:38px;

    text-shadow:
    0 0 20px cyan;

    z-index:2;

}


#bossUI{

    display:none;

    position:absolute;

    top:80px;

    width:100%;

    text-align:center;

    color:red;

    font-size:28px;

    z-index:2;

}





/* 게임오버 */

#gameOver{

    display:none;

    position:absolute;

    width:100%;

    height:100%;

    background:rgba(0,0,0,0.85);

    color:white;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    font-size:60px;

    z-index:5;

}


#gameOver button{

    margin-top:25px;

    padding:15px 50px;

    font-size:25px;

    cursor:pointer;

}



</style>

</head>



<body>


<div id="title">
🚀 SPACE EXPLORER : ALIEN WAR
</div>



<div id="ui">

❤️ <span id="life">❤️❤️❤️</span>

<br>

⭐ SCORE :
<span id="score">
0
</span>


<br>

👾 DESTROY :
<span id="kills">
0
</span>


</div>




<div id="bossUI">

👑 BOSS HP :

<span id="bossHP">

</span>


</div>





<div id="gameOver">


GAME OVER


<div id="finalScore"></div>



<button onclick="restart()">
RESTART
</button>


<button onclick="mainMenu()">
MAIN MENU
</button>



</div>




<canvas id="game" width="1200" height="700"></canvas>






<script>



const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");




// =================
// 플레이어
// =================


let player={


x:150,

y:350,


speed:7,


life:3


};




// =================
// 키 입력
// =================


let keys={};



document.addEventListener("keydown",e=>{


keys[e.key]=true;



if(e.code==="Space"){

shoot();

}


});



document.addEventListener("keyup",e=>{


keys[e.key]=false;


});




// =================
// 레이저
// =================


let lasers=[];



function shoot(){


lasers.push({

x:player.x+50,

y:player.y-15,

speed:14

});


}







// =================
// 별 배경
// =================


let stars=[];


for(let i=0;i<150;i++){


stars.push({

x:Math.random()*1200,

y:Math.random()*700,

size:Math.random()*3,

speed:0.3+Math.random()*0.8


});


}




function updateStars(){


stars.forEach(s=>{


s.x-=s.speed;



if(s.x<0){

s.x=1200;

s.y=Math.random()*700;

}


});


}








// =================
// 적
// =================


let enemies=[];



let enemyList=[


{

icon:"👾",

hp:30,

speed:4


},



{

icon:"🛸",

hp:20,

speed:6


},



{

icon:"👹",

hp:80,

speed:2


}


];






function spawnEnemy(){


let e=

enemyList[
Math.floor(Math.random()*enemyList.length)
];



enemies.push({


x:1250,

y:Math.random()*620+40,


hp:e.hp,

speed:e.speed,

icon:e.icon


});


}




setInterval(()=>{


if(gameRun && !boss)

spawnEnemy();


},1800);








// =================
// 보스
// =================


let boss=null;


let kills=0;



function createBoss(){


boss={


x:1100,

y:350,


hp:500,


speed:1


};


document.getElementById("bossUI").style.display="block";


alert("⚠ WARNING\nBOSS APPROACHING!");



}









// =================
// 폭발 효과
// =================


let explosions=[];



function explosion(x,y){


explosions.push({

x:x,

y:y,

size:10

});


}








// =================
// 게임 상태
// =================


let score=0;

let gameRun=true;










function update(){


if(!gameRun)return;



updateStars();



// 이동


if(keys["ArrowUp"])

player.y-=player.speed;



if(keys["ArrowDown"])

player.y+=player.speed;



if(keys["ArrowLeft"])

player.x-=player.speed;



if(keys["ArrowRight"])

player.x+=player.speed;




player.x=Math.max(0,Math.min(1150,player.x));

player.y=Math.max(50,Math.min(650,player.y));






// 레이저 이동


lasers.forEach((l,i)=>{


l.x+=l.speed;


if(l.x>1200)

lasers.splice(i,1);


});








// 적 처리


enemies.forEach((e,i)=>{


e.x-=e.speed;





// 화면 탈출

if(e.x<0){


player.life--;

enemies.splice(i,1);


}






// 충돌


if(

Math.abs(e.x-player.x)<50 &&

Math.abs(e.y-player.y)<50

){


player.life--;

enemies.splice(i,1);


}







// 레이저 공격


lasers.forEach((l,j)=>{


if(

Math.abs(l.x-e.x)<40 &&

Math.abs(l.y-e.y)<40

){


e.hp-=10;

lasers.splice(j,1);


}


});





if(e.hp<=0){


score+=100;

kills++;


explosion(e.x,e.y);


enemies.splice(i,1);



}



});







// 보스 등장


if(kills>=25 && boss==null){


createBoss();


}







// 보스전


if(boss){


boss.x-=boss.speed;



lasers.forEach((l,i)=>{


if(

Math.abs(l.x-boss.x)<100 &&

Math.abs(l.y-boss.y)<100

){


boss.hp-=10;


lasers.splice(i,1);


}



});





if(

Math.abs(boss.x-player.x)<100

){


player.life--;


}






document.getElementById("bossHP").innerHTML=boss.hp;



if(boss.hp<=0){


alert("🏆 BOSS DEFEATED!");

location.reload();


}



}








// 폭발


explosions.forEach((e,i)=>{


e.size+=2;


if(e.size>40)

explosions.splice(i,1);


});







updateUI();






if(player.life<=0)

endGame();



}









function draw(){


ctx.clearRect(0,0,1200,700);



// 별

ctx.fillStyle="white";


stars.forEach(s=>{


ctx.fillRect(

s.x,

s.y,

s.size,

s.size

);


});





// 우주선


ctx.font="60px Arial";

ctx.fillText(

"🚀",

player.x,

player.y

);






// 레이저


ctx.fillStyle="#00ffff";


lasers.forEach(l=>{


ctx.fillRect(

l.x,

l.y,

25,

5

);


});






// 적


enemies.forEach(e=>{


ctx.font="55px Arial";

ctx.fillText(

e.icon,

e.x,

e.y

);



});






// 보스


if(boss){


ctx.font="100px Arial";


ctx.fillText(

"👑",

boss.x,

boss.y

);


}






// 폭발


explosions.forEach(e=>{


ctx.fillStyle="orange";


ctx.beginPath();


ctx.arc(

e.x,

e.y,

e.size,

0,

Math.PI*2

);


ctx.fill();


});



}









function updateUI(){


let heart="";


for(let i=0;i<player.life;i++)

heart+="❤️";



document.getElementById("life").innerHTML=heart;



document.getElementById("score").innerHTML=score;


document.getElementById("kills").innerHTML=kills;



}






function endGame(){


gameRun=false;


document.getElementById("gameOver").style.display="flex";


document.getElementById("finalScore").innerHTML=

"FINAL SCORE : "+score;


}






function restart(){

location.reload();

}


function mainMenu(){

location.href="main.html";

}







function gameLoop(){


update();

draw();


requestAnimationFrame(gameLoop);


}


gameLoop();



</script>


</body>

</html>
