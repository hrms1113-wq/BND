<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<title>SPACE EXPLORER : ALIEN WAR</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:black;
font-family:Arial,sans-serif;
}


canvas{
background:#020617;
display:block;
}



#ui{

position:absolute;
top:20px;
left:20px;

color:white;
font-size:22px;
line-height:35px;

z-index:5;

}



#title{

position:absolute;
top:20px;

width:100%;

text-align:center;

font-size:35px;

color:#70eaff;

text-shadow:
0 0 20px cyan;

z-index:5;

}



#bossUI{

display:none;

position:absolute;

top:90px;

width:100%;

text-align:center;

font-size:30px;

color:red;

z-index:5;

}



#message{

display:none;

position:absolute;

top:40%;

width:100%;

text-align:center;

font-size:60px;

color:white;

z-index:10;

text-shadow:
0 0 30px cyan;

}




#end{

display:none;

position:absolute;

width:100%;
height:100%;

background:rgba(0,0,0,.85);

z-index:20;

align-items:center;

justify-content:center;

flex-direction:column;

color:white;

}



#end h1{

font-size:70px;

color:#70eaff;

}


button{

padding:15px 50px;

margin:10px;

font-size:25px;

border-radius:30px;

border:none;

cursor:pointer;

background:#0284c7;

color:white;

}


</style>

</head>


<body>


<div id="title">
🚀 SPACE EXPLORER : ALIEN WAR
</div>



<div id="ui">

❤️ <span id="life">❤️❤️❤️</span>

<br>

⭐ SCORE :
<span id="score">0</span>

<br>

🚀 LEVEL :
<span id="level">1</span>

<br>

💎 CRYSTAL :
<span id="crystal">0</span>

</div>



<div id="bossUI">

👑 BOSS HP :
<span id="bossHP"></span>

</div>




<div id="message">

LEVEL UP

</div>




<div id="end">


<h1 id="endTitle"></h1>

<p id="endScore"></p>


<button onclick="location.reload()">
다시 플레이
</button>


<button onclick="location.href='main.html'">
메인 화면
</button>


</div>




<canvas id="game" width="1200" height="700"></canvas>





<script>


const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");



// =====================
// 업그레이드 데이터 불러오기
// =====================


let laserLevel=
Number(localStorage.getItem("laser")) || 1;


let engineLevel=
Number(localStorage.getItem("engine")) || 1;


let shieldLevel=
Number(localStorage.getItem("shield")) || 1;



// 강화 적용


let laserDamage =
10 * laserLevel;


let moveSpeed =
7 + (engineLevel-1)*2;


let shieldReduce =
(shieldLevel-1)*0.2;



let crystal =
Number(localStorage.getItem("crystal")) || 0;





// 플레이어


let player={

x:150,

y:350,

speed:moveSpeed,

life:3

};



// 키

let keys={};


document.addEventListener("keydown",e=>{


keys[e.key]=true;


if(e.code==="Space"){

shoot();

}


});


document.addEventListener("keyup",e=>{

keys[e.key]=false;

});



// 레이저


let lasers=[];


function shoot(){


lasers.push({

x:player.x+50,

y:player.y-10

});


}


// 별

let stars=[];


for(let i=0;i<150;i++){


stars.push({

x:Math.random()*1200,

y:Math.random()*700,

size:Math.random()*3+1

});


}
// =====================
// 별 움직임
// =====================

function moveStars(){

stars.forEach(s=>{

s.x-=0.5;


if(s.x<0){

s.x=1200;
s.y=Math.random()*700;

}

});

}





// =====================
// 적 시스템
// =====================


let enemies=[];



const enemyTypes=[


{
icon:"👾",
hp:30,
speed:4,
score:100,
crystal:10
},


{
icon:"🛸",
hp:40,
speed:6,
score:150,
crystal:15
},


{
icon:"👹",
hp:80,
speed:2,
score:200,
crystal:30
}


];





function createEnemy(){


let type=
enemyTypes[
Math.floor(Math.random()*enemyTypes.length)
];



enemies.push({

x:1250,

y:Math.random()*620+40,

hp:type.hp,

speed:type.speed,

icon:type.icon,

score:type.score,

crystal:type.crystal


});


}




let spawn=setInterval(()=>{


if(gameRunning && !boss){

createEnemy();

}


},1800);





// =====================
// 점수 / 레벨
// =====================


let score=0;

let level=1;

let kills=0;




function checkLevel(){



let newLevel=Math.floor(score/1500)+1;



if(newLevel>3)

newLevel=3;



if(newLevel>level){


level=newLevel;


showMessage(
"LEVEL "+level+" UP!"
);


}




// LEVEL 3 보스 등장


if(level===3 && boss==null){


createBoss();


}



}







// =====================
// 보스
// =====================


let boss=null;



function createBoss(){


document.getElementById("bossUI").style.display="block";



showMessage(
"⚠ BOSS APPROACHING"
);



boss={


x:1050,

y:350,

hp:500,

speed:1


};


}





// =====================
// 게임 상태
// =====================


let gameRunning=true;





function update(){



if(!gameRunning)

return;



moveStars();





// 플레이어 이동


if(keys["ArrowUp"])

player.y-=player.speed;


if(keys["ArrowDown"])

player.y+=player.speed;


if(keys["ArrowLeft"])

player.x-=player.speed;


if(keys["ArrowRight"])

player.x+=player.speed;




player.x=Math.max(
0,
Math.min(1150,player.x)
);



player.y=Math.max(
40,
Math.min(650,player.y)
);







// 레이저 이동


lasers.forEach((l,i)=>{


l.x+=15;



if(l.x>1200)

lasers.splice(i,1);



});








// =====================
// 적 처리
// =====================


enemies.forEach((e,i)=>{



e.x-=e.speed;





// 적이 지나감


if(e.x<0){


damagePlayer();


enemies.splice(i,1);


}




// 충돌


if(

Math.abs(e.x-player.x)<50 &&

Math.abs(e.y-player.y)<50

){


damagePlayer();


enemies.splice(i,1);


}






// 레이저 충돌


lasers.forEach((l,j)=>{



if(

Math.abs(l.x-e.x)<40 &&

Math.abs(l.y-e.y)<50

){


e.hp-=laserDamage;


lasers.splice(j,1);


}



});






// 처치


if(e.hp<=0){



score+=e.score;


crystal+=e.crystal;


kills++;



saveCrystal();



enemies.splice(i,1);



}



});








// =====================
// 보스 공격
// =====================


if(boss){



boss.x-=boss.speed;



if(boss.x<800)

boss.x=800;





lasers.forEach((l,i)=>{


if(

Math.abs(l.x-boss.x)<100 &&

Math.abs(l.y-boss.y)<100

){


boss.hp-=laserDamage;


lasers.splice(i,1);


}



});



document.getElementById("bossHP").innerHTML=
boss.hp;



if(boss.hp<=0){


victory();


}



}







checkLevel();



updateUI();





if(player.life<=0){


gameOver();


}



}

// =====================
// 플레이어 피해 처리
// =====================

function damagePlayer(){


let damage=1-shieldReduce;



if(damage<0.2)

damage=0.2;



player.life-=damage;



}



// =====================
// 저장
// =====================


function saveCrystal(){


localStorage.setItem(
"crystal",
Math.floor(crystal)
);


}





// =====================
// 화면 표시
// =====================


function updateUI(){



let hearts="";



for(let i=0;i<Math.floor(player.life);i++){


hearts+="❤️";


}



document.getElementById("life").innerHTML=
hearts;



document.getElementById("score").innerHTML=
score;



document.getElementById("level").innerHTML=
level;



document.getElementById("crystal").innerHTML=
Math.floor(crystal);



}





// =====================
// 메시지
// =====================


function showMessage(text){


let m=document.getElementById("message");


m.innerHTML=text;


m.style.display="block";



setTimeout(()=>{


m.style.display="none";


},1500);



}







// =====================
// 게임 종료
// =====================


function gameOver(){


gameRunning=false;



document.getElementById("end").style.display=
"flex";



document.getElementById("endTitle").innerHTML=
"GAME OVER";



document.getElementById("endScore").innerHTML=

"FINAL SCORE : "+score;



}






function victory(){


gameRunning=false;



document.getElementById("end").style.display=
"flex";



document.getElementById("endTitle").innerHTML=

"🏆 MISSION COMPLETE";



document.getElementById("endScore").innerHTML=

"보스 격파 성공!<br>SCORE : "+score;



}







// =====================
// 그리기
// =====================


function draw(){



ctx.clearRect(
0,
0,
1200,
700
);





// 별


ctx.fillStyle="white";


stars.forEach(s=>{


ctx.fillRect(
s.x,
s.y,
s.size,
s.size
);



});







// 우주선


ctx.font="60px Arial";


ctx.fillText(

"🚀",

player.x,

player.y

);






// 레이저


ctx.fillStyle="cyan";



lasers.forEach(l=>{


ctx.fillRect(

l.x,

l.y,

30,

5

);


});







// 적


enemies.forEach(e=>{


ctx.font="55px Arial";


ctx.fillText(

e.icon,

e.x,

e.y

);


});







// 보스


if(boss){


ctx.font="100px Arial";


ctx.fillText(

"👑",

boss.x,

boss.y

);


}



}








// =====================
// 게임 루프
// =====================


function loop(){


update();


draw();



requestAnimationFrame(loop);


}



loop();



</script>


</body>

</html>
