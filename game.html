<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<title>SPACE EXPLORER : ALIEN WAR</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}


canvas{
    display:block;
    background:#020617;
}


#title{

    position:absolute;
    top:20px;
    width:100%;

    text-align:center;

    color:#70eaff;
    font-size:38px;

    text-shadow:
    0 0 20px cyan;

    z-index:2;

}


#ui{

    position:absolute;
    top:20px;
    left:20px;

    color:white;

    font-size:22px;

    line-height:35px;

    z-index:2;

}



#bossUI{

    display:none;

    position:absolute;

    top:80px;

    width:100%;

    text-align:center;

    color:red;

    font-size:30px;

    z-index:3;

}



#message{

    display:none;

    position:absolute;

    top:40%;

    width:100%;

    text-align:center;

    color:white;

    font-size:60px;

    text-shadow:
    0 0 30px cyan;

    z-index:5;

}



#endScreen{

    display:none;

    position:absolute;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.85);

    justify-content:center;

    align-items:center;

    flex-direction:column;

    color:white;

    z-index:10;

}


#endScreen h1{

    font-size:70px;

    color:#70eaff;

}



#endScreen p{

    font-size:30px;

    margin:20px;

}



button{

    padding:15px 50px;

    margin:10px;

    font-size:25px;

    border:none;

    border-radius:30px;

    cursor:pointer;

    background:#0284c7;

    color:white;

}


button:hover{

    transform:scale(1.1);

}


</style>

</head>


<body>


<div id="title">

🚀 SPACE EXPLORER : ALIEN WAR

</div>


<div id="ui">


❤️ <span id="life">
❤️❤️❤️
</span>

<br>


⭐ SCORE :
<span id="score">
0
</span>

<br>


🚀 LEVEL :
<span id="level">
1
</span>


<br>


👾 DESTROY :
<span id="kills">
0
</span>


</div>



<div id="bossUI">

👑 BOSS HP :

<span id="bossHP">

</span>


</div>




<div id="message">

LEVEL UP!

</div>





<div id="endScreen">


<h1 id="endTitle"></h1>


<p id="endText"></p>


<button onclick="location.reload()">

다시 플레이

</button>


<button onclick="location.href='main.html'">

메인 화면

</button>


</div>





<canvas id="game" width="1200" height="700"></canvas>





<script>


const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


// 플레이어

let player={

x:150,
y:350,

speed:7,

life:3

};



// 키

let keys={};


document.addEventListener("keydown",e=>{

keys[e.key]=true;


if(e.code==="Space"){

shoot();

}

});


document.addEventListener("keyup",e=>{

keys[e.key]=false;

});




// 레이저

let lasers=[];


function shoot(){

lasers.push({

x:player.x+50,

y:player.y-10,

speed:15

});

}



// 별 배경

let stars=[];


for(let i=0;i<150;i++){

stars.push({

x:Math.random()*1200,

y:Math.random()*700,

size:Math.random()*3+1,

speed:0.5

});

}



function moveStars(){

stars.forEach(s=>{

s.x-=s.speed;


if(s.x<0){

s.x=1200;

s.y=Math.random()*700;

}

});

}




// 적

let enemies=[];


let enemyTypes=[

{
icon:"👾",
hp:30,
speed:4
},

{
icon:"🛸",
hp:20,
speed:6
},

{
icon:"👹",
hp:80,
speed:2
}

];



let spawnTime=1800;



function spawnEnemy(){

let type=
enemyTypes[
Math.floor(Math.random()*enemyTypes.length)
];


enemies.push({

x:1250,

y:Math.random()*620+40,

hp:type.hp,

speed:type.speed,

icon:type.icon

});


}



setInterval(()=>{

if(gameRunning && !boss){

spawnEnemy();

}

},1800);







// 점수 레벨

let score=0;

let level=1;

let kills=0;



function checkLevel(){


let newLevel=Math.floor(score/1500)+1;


if(newLevel>5)

newLevel=5;



if(newLevel>level){


level=newLevel;


showMessage("LEVEL "+level+" UP!");

}



if(level===5 && boss==null){

createBoss();

}


}




// 보스

let boss=null;


function createBoss(){


document.getElementById("bossUI").style.display="block";


boss={

x:1100,

y:350,

hp:500,

speed:1

};


showMessage("⚠ BOSS APPROACHING");


}




// 게임 상태

let gameRunning=true;





function update(){


if(!gameRunning)
return;



moveStars();



// 이동


if(keys["ArrowUp"])

player.y-=player.speed;


if(keys["ArrowDown"])

player.y+=player.speed;


if(keys["ArrowLeft"])

player.x-=player.speed;


if(keys["ArrowRight"])

player.x+=player.speed;



player.x=Math.max(0,Math.min(1150,player.x));

player.y=Math.max(40,Math.min(650,player.y));





// 레이저


lasers.forEach((l,i)=>{


l.x+=l.speed;


if(l.x>1200)

lasers.splice(i,1);


});




// 적


enemies.forEach((e,i)=>{


e.x-=e.speed;



if(e.x<0){


player.life--;

enemies.splice(i,1);


}



if(

Math.abs(e.x-player.x)<50 &&

Math.abs(e.y-player.y)<50

){


player.life--;

enemies.splice(i,1);


}




lasers.forEach((l,j)=>{


if(

Math.abs(l.x-e.x)<40 &&

Math.abs(l.y-e.y)<40

){


e.hp-=10;

lasers.splice(j,1);


}

});



if(e.hp<=0){


score+=100;

kills++;

enemies.splice(i,1);


}


});






// 보스

if(boss){


boss.x-=boss.speed;



lasers.forEach((l,i)=>{


if(

Math.abs(l.x-boss.x)<100 &&

Math.abs(l.y-boss.y)<100

){

boss.hp-=10;

lasers.splice(i,1);

}


});



document.getElementById("bossHP").innerHTML=boss.hp;



if(boss.hp<=0){


victory();


}



}




checkLevel();


updateUI();



if(player.life<=0){

gameOver();

}


}





function draw(){


ctx.clearRect(0,0,1200,700);



// 별

ctx.fillStyle="white";


stars.forEach(s=>{

ctx.fillRect(
s.x,
s.y,
s.size,
s.size
);


});



// 플레이어

ctx.font="60px Arial";

ctx.fillText(
"🚀",
player.x,
player.y
);



// 레이저

ctx.fillStyle="cyan";


lasers.forEach(l=>{

ctx.fillRect(
l.x,
l.y,
25,
5
);

});



// 적

enemies.forEach(e=>{


ctx.font="55px Arial";


ctx.fillText(
e.icon,
e.x,
e.y
);


});



// 보스

if(boss){

ctx.font="100px Arial";


ctx.fillText(
"👑",
boss.x,
boss.y
);


}


}






function updateUI(){


let hearts="";


for(let i=0;i<player.life;i++){

hearts+="❤️";

}


document.getElementById("life").innerHTML=hearts;


document.getElementById("score").innerHTML=score;


document.getElementById("level").innerHTML=level;


document.getElementById("kills").innerHTML=kills;


}






function showMessage(text){


let m=document.getElementById("message");


m.innerHTML=text;

m.style.display="block";


setTimeout(()=>{

m.style.display="none";

},1500);


}





function gameOver(){


gameRunning=false;


document.getElementById("endScreen").style.display="flex";


document.getElementById("endTitle").innerHTML="GAME OVER";


document.getElementById("endText").innerHTML=

"FINAL SCORE : "+score;


}





function victory(){


gameRunning=false;


document.getElementById("bossUI").style.display="none";


document.getElementById("endScreen").style.display="flex";


document.getElementById("endTitle").innerHTML=

"🏆 MISSION COMPLETE";


document.getElementById("endText").innerHTML=

"보스 격파 성공!<br>FINAL SCORE : "+score;


}





function gameLoop(){


update();

draw();


requestAnimationFrame(gameLoop);


}


gameLoop();



</script>


</body>

</html>
