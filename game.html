<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<title>SPACE EXPLORER - Battle</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{
    overflow:hidden;
    background:black;
}


canvas{
    display:block;
    background:#020617;
}


/* 정보창 */

#ui{

    position:absolute;
    top:20px;
    left:20px;

    color:white;
    font-size:22px;

    line-height:35px;

    z-index:2;

}


#title{

    position:absolute;

    top:20px;

    width:100%;

    text-align:center;

    color:#70eaff;

    font-size:40px;

    text-shadow:0 0 20px cyan;

    z-index:2;

}


/* 보스 */

#bossBar{

    position:absolute;

    top:80px;

    width:100%;

    text-align:center;

    color:red;

    font-size:25px;

    display:none;

}


/* 게임 종료 */

#gameOver{

    display:none;

    position:absolute;

    width:100%;

    height:100%;

    background:rgba(0,0,0,.8);

    color:white;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    font-size:60px;

    z-index:5;

}


#gameOver button{

    margin-top:30px;

    padding:15px 40px;

    font-size:25px;

    cursor:pointer;

}


</style>

</head>


<body>


<div id="title">
🚀 SPACE EXPLORER : ALIEN BATTLE
</div>



<div id="ui">

❤️ 생명 :
<span id="life">
❤️❤️❤️❤️❤️
</span>

<br>

⭐ 점수 :
<span id="score">
0
</span>


</div>



<div id="bossBar">

👑 보스 HP :
<span id="bossHP">
</span>

</div>




<div id="gameOver">


GAME OVER


<div id="result"></div>


<button onclick="restart()">
다시 시작
</button>


<button onclick="mainMenu()">
메인 화면
</button>


</div>




<canvas id="game" width="1200" height="700"></canvas>




<script>


const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");



// ----------------
// 플레이어
// ----------------


let player={

x:150,
y:350,

speed:6,

life:5

};




// 업그레이드 연결 대비

let playerData={

laserLevel:1,
shieldLevel:1,
engineLevel:1

};




// 키

let keys={};



// 레이저

let lasers=[];




document.addEventListener("keydown",e=>{


keys[e.key]=true;


if(e.code==="Space"){

shoot();

}


});



document.addEventListener("keyup",e=>{


keys[e.key]=false;


});





function shoot(){


lasers.push({

x:player.x+40,

y:player.y,

speed:12

});


}







// ----------------
// 별 배경
// ----------------


let stars=[];


for(let i=0;i<150;i++){


stars.push({

x:Math.random()*1200,

y:Math.random()*700,

size:Math.random()*3+1,

speed:0.3+Math.random()*0.5

});


}



function moveStars(){


stars.forEach(s=>{


s.x-=s.speed;


if(s.x<0){

s.x=1200;
s.y=Math.random()*700;

}


});


}








// ----------------
// 적
// ----------------


let enemies=[];


let enemyTypes=[


{

icon:"👾",
hp:30,
speed:2,
damage:1

},


{

icon:"👹",
hp:70,
speed:1.5,
damage:1

},


{

icon:"🛸",
hp:20,
speed:3,
damage:1

}


];





function createEnemy(){


let type=
enemyTypes[
Math.floor(Math.random()*enemyTypes.length)
];



enemies.push({


x:1250,

y:Math.random()*650+30,


hp:type.hp,

speed:type.speed,

damage:type.damage,

icon:type.icon


});


}



setInterval(()=>{


if(gameRunning && !boss)

createEnemy();


},2500);








// ----------------
// 보스
// ----------------


let boss=null;

let killCount=0;



function createBoss(){


boss={

x:1050,

y:350,

hp:500,

speed:0.7

};


document.getElementById("bossBar").style.display="block";


}








let score=0;

let gameRunning=true;









function update(){



if(!gameRunning)
return;



moveStars();



// 이동


if(keys["ArrowUp"])
player.y-=player.speed;


if(keys["ArrowDown"])
player.y+=player.speed;


if(keys["ArrowLeft"])
player.x-=player.speed;


if(keys["ArrowRight"])
player.x+=player.speed;




player.x=Math.max(0,Math.min(1150,player.x));

player.y=Math.max(40,Math.min(650,player.y));






// 레이저


lasers.forEach((l,i)=>{


l.x+=l.speed;


if(l.x>1200)

lasers.splice(i,1);


});






// 적 처리


enemies.forEach((e,i)=>{


e.x-=e.speed;



// 화면 통과

if(e.x<0){


player.life--;

enemies.splice(i,1);


}




// 충돌

if(

Math.abs(e.x-player.x)<50 &&

Math.abs(e.y-player.y)<50

){


player.life--;

enemies.splice(i,1);


}






// 레이저 충돌


lasers.forEach((l,j)=>{


if(

Math.abs(l.x-e.x)<40 &&

Math.abs(l.y-e.y)<40

){


e.hp-=10;

lasers.splice(j,1);


}


});





if(e.hp<=0){


score+=100;

killCount++;


enemies.splice(i,1);


}


});







// 보스 등장

if(killCount>=20 && boss==null){

createBoss();

}





// 보스 전투


if(boss){


boss.x-=boss.speed;



lasers.forEach((l,i)=>{


if(

Math.abs(l.x-boss.x)<80 &&

Math.abs(l.y-boss.y)<80

){


boss.hp-=10;

lasers.splice(i,1);


}


});




if(

Math.abs(boss.x-player.x)<100 &&

Math.abs(boss.y-player.y)<100

){

player.life--;

}





document.getElementById("bossHP").innerHTML=boss.hp;



if(boss.hp<=0){


alert("🏆 보스 격파! 임무 성공!");

location.reload();


}



}







updateUI();






if(player.life<=0){


gameOver();


}



}









function draw(){


ctx.clearRect(0,0,1200,700);



// 별

ctx.fillStyle="white";


stars.forEach(s=>{


ctx.fillRect(
s.x,
s.y,
s.size,
s.size
);


});




// 우주선

ctx.font="60px Arial";

ctx.fillText(
"🚀",
player.x,
player.y
);





// 레이저

ctx.fillStyle="red";


lasers.forEach(l=>{


ctx.fillRect(

l.x,
l.y,
20,
5

);


});





// 적


enemies.forEach(e=>{


ctx.font="55px Arial";


ctx.fillText(

e.icon,

e.x,

e.y

);


});




// 보스


if(boss){


ctx.font="100px Arial";


ctx.fillText(
"👑",
boss.x,
boss.y
);


}



}








function updateUI(){


let hearts="";


for(let i=0;i<player.life;i++){

hearts+="❤️";

}


document.getElementById("life").innerHTML=hearts;


document.getElementById("score").innerHTML=score;


}






function gameOver(){


gameRunning=false;


document.getElementById("gameOver").style.display="flex";


document.getElementById("result").innerHTML=

"점수 : "+score;


}






function restart(){

location.reload();

}



function mainMenu(){

location.href="main.html";

}







function loop(){


update();

draw();


requestAnimationFrame(loop);


}



loop();



</script>


</body>

</html>
