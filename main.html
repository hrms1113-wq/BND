<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPACE EXPLORER - Main</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}


body{

    overflow:hidden;
    background:#020617;

}


/* 우주 */

.space{

    width:100%;
    height:100vh;

    background:
    radial-gradient(circle,#172554,#020617,#000);

}



/* 별 */

.star{

    position:absolute;

    width:3px;
    height:3px;

    background:white;

    border-radius:50%;

    animation:blink 2s infinite alternate;

}


@keyframes blink{

    from{
        opacity:.2;
    }

    to{
        opacity:1;
    }

}



/* 행성 */

.planet{

    position:absolute;

    border-radius:50%;

    animation:move 8s infinite alternate;

}



.earth{

    width:180px;
    height:180px;

    background:#2563eb;

    left:80px;
    top:150px;

}


.mars{

    width:130px;
    height:130px;

    background:#ef4444;

    right:120px;
    bottom:150px;

}



@keyframes move{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-30px);
    }

}




/* UI */

.status{

    position:absolute;

    top:20px;
    left:30px;

    color:white;

    font-size:20px;

    background:rgba(0,0,0,.5);

    padding:20px;

    border-radius:15px;

}



.title{

    position:absolute;

    top:25px;

    width:100%;

    text-align:center;

    color:#70eaff;

    font-size:45px;

    text-shadow:0 0 20px cyan;

}




/* 우주선 */


.ship{

    position:absolute;

    font-size:80px;

    left:50%;
    top:55%;

    transform:translate(-50%,-50%);

}




/* 메뉴 */

.menu{

    position:absolute;

    right:30px;

    top:120px;

    display:flex;

    flex-direction:column;

    gap:15px;

}



button{

    width:230px;

    padding:15px;

    border:none;

    border-radius:30px;

    background:#0284c7;

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.3s;

}



button:hover{

    transform:scale(1.1);

    box-shadow:0 0 20px cyan;

}



.info{

    position:absolute;

    bottom:20px;

    width:100%;

    text-align:center;

    color:#aaa;

}



</style>

</head>



<body>


<div class="space" id="space"></div>


<div class="planet earth"></div>

<div class="planet mars"></div>



<h1 class="title">

🚀 SPACE EXPLORER

</h1>




<div class="status">


❤️ 체력 : 100

<br>

⚡ 연료 : 100

<br>

💎 자원 : <span id="resource">0</span>

<br>

💰 코인 : <span id="coin">0</span>

<br>

🌌 은하 : 1


</div>





<div class="ship" id="ship">

🚀

</div>





<div class="menu">


<button onclick="explorePlanet()">

🌍 행성 탐험

</button>



<button onclick="upgradeShip()">

🚀 우주선 업그레이드

</button>



<button onclick="mineResource()">

⛏️ 자원 채굴

</button>




<button onclick="battleAlien()">

👽 외계 생명체 전투

</button>




<button onclick="discoverGalaxy()">

🌌 새로운 은하 발견

</button>



</div>





<div class="info">

방향키 : 우주선 이동 | SPACE EXPLORER MISSION

</div>





<script>


// 별 생성

const space=document.getElementById("space");


for(let i=0;i<200;i++){


    let star=document.createElement("div");

    star.className="star";


    star.style.left=Math.random()*100+"%";

    star.style.top=Math.random()*100+"%";


    star.style.animationDuration=

    (1+Math.random()*3)+"s";


    space.appendChild(star);


}




// 우주선 이동


const ship=document.getElementById("ship");


let x=window.innerWidth/2;

let y=window.innerHeight/2;


let speed=7;


let keys={};



document.addEventListener("keydown",e=>{

keys[e.key]=true;

});



document.addEventListener("keyup",e=>{

keys[e.key]=false;

});




function moveShip(){


if(keys["ArrowLeft"])
x-=speed;


if(keys["ArrowRight"])
x+=speed;


if(keys["ArrowUp"])
y-=speed;


if(keys["ArrowDown"])
y+=speed;



ship.style.left=x+"px";

ship.style.top=y+"px";



requestAnimationFrame(moveShip);


}


moveShip();





// 기능


let resource=0;

let coin=0;




function mineResource(){


resource+=10;

document.getElementById("resource").innerHTML=resource;


alert("⛏️ 자원 10개를 채굴했습니다!");

}



function upgradeShip(){


if(resource>=20){

resource-=20;

alert("🚀 우주선 업그레이드 완료!");

}

else{

alert("자원이 부족합니다!");

}


}




function explorePlanet(){


alert("🌍 새로운 행성을 탐험합니다!");

}



function battleAlien(){


alert("👽 외계 생명체 발견!\n전투 준비!");



}



function discoverGalaxy(){


alert("🌌 새로운 은하 탐색 중...");

coin+=100;

document.getElementById("coin").innerHTML=coin;


}



</script>


</body>

</html>
