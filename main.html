<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPACE EXPLORER - Main Menu</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}


body{

    height:100vh;
    overflow:hidden;

    background:
    radial-gradient(circle at center,#162447,#020617,#000);

    color:white;

}


/* 별 배경 */

.star{

    position:absolute;

    background:white;

    border-radius:50%;

    animation:twinkle 2s infinite alternate;

}


@keyframes twinkle{

    from{
        opacity:0.2;
    }

    to{
        opacity:1;
    }

}



/* 제목 */

.title{

    position:absolute;

    top:60px;

    width:100%;

    text-align:center;

}


.title h1{

    font-size:70px;

    color:#70eaff;

    text-shadow:
    0 0 20px cyan,
    0 0 50px cyan;

}



.title p{

    margin-top:20px;

    font-size:25px;

    color:#ddd;

}



/* 우주선 */

.ship{

    position:absolute;

    left:50%;

    top:45%;

    transform:translate(-50%,-50%);

    font-size:130px;

    animation:float 3s infinite alternate;

}



@keyframes float{

    from{
        transform:translate(-50%,-50%);
    }

    to{
        transform:translate(-50%,-60%);
    }

}



/* 메뉴 */

.menu{

    position:absolute;

    top:65%;

    left:50%;

    transform:translateX(-50%);

    display:flex;

    flex-direction:column;

    gap:20px;

}



button{

    width:300px;

    padding:18px;

    border-radius:40px;

    border:none;

    background:#0284c7;

    color:white;

    font-size:24px;

    cursor:pointer;

    box-shadow:0 0 20px cyan;

    transition:.3s;

}



button:hover{

    transform:scale(1.1);

    background:#0ea5e9;

}



/* 우주선 정보 */

.status{

    position:absolute;

    top:30px;

    right:30px;

    background:rgba(0,0,0,.5);

    border:1px solid cyan;

    border-radius:15px;

    padding:20px;

    font-size:18px;

    line-height:35px;

}



/* 제작자 */

.creator{

    position:absolute;

    bottom:20px;

    width:100%;

    text-align:center;

    color:#aaa;

}


</style>

</head>



<body>



<!-- 별 생성 -->

<script>

for(let i=0;i<200;i++){

    let star=document.createElement("div");

    star.className="star";

    let size=Math.random()*3+1;

    star.style.width=size+"px";

    star.style.height=size+"px";

    star.style.left=Math.random()*100+"%";

    star.style.top=Math.random()*100+"%";

    star.style.animationDuration=
    (1+Math.random()*3)+"s";

    document.body.appendChild(star);

}

</script>





<div class="title">

<h1>

🚀 SPACE EXPLORER

</h1>


<p>

미지의 우주에서 외계 생명체와 전투하라

</p>


</div>




<div class="ship">

🚀

</div>





<div class="status">

🚀 우주선 : SE-01

<br>

❤️ 체력 : 100

<br>

🔫 레이저 : Lv.1

<br>

🛡 방어막 : Lv.1

<br>

⚡ 엔진 : Lv.1


</div>







<div class="menu">


<button onclick="startGame()">

🌌 게임 시작

</button>



<button onclick="upgrade()">

🚀 우주선 관리

</button>


</div>







<div class="creator">

Created by 우다흰

</div>






<script>


function startGame(){

    location.href="game.html";

}



function upgrade(){

    location.href="upgrade.html";

}



</script>



</body>

</html>
