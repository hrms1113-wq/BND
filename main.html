<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<title>Space Explorer Mission</title>


<style>

body{

margin:0;
overflow:hidden;
background:#020617;

font-family:Arial;

}


canvas{

display:block;
background:
radial-gradient(circle,#102040,#000);

}


#ui{

position:absolute;
top:15px;
left:20px;

color:white;

font-size:22px;

}


#help{

position:absolute;
bottom:15px;
width:100%;

text-align:center;

color:#aaa;

}


</style>

</head>


<body>


<div id="ui">

❤️ HP : <span id="hp">100</span>

&nbsp;&nbsp;

⭐ 점수 : <span id="score">0</span>

&nbsp;&nbsp;

💎 자원 : <span id="resource">0</span>

</div>


<div id="help">

방향키 : 이동 | SPACE : 레이저 발사 | 자원과 별을 모으세요!

</div>


<canvas id="game" width="1000" height="650"></canvas>


<script>


const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");



// 플레이어

let ship={

x:500,

y:500,

size:25,

speed:6,

hp:100

};



// 점수

let score=0;

let resource=0;



// 키

let keys={};


document.addEventListener("keydown",e=>{

keys[e.key]=true;


if(e.code==="Space"){

laser();

}


});


document.addEventListener("keyup",e=>{

keys[e.key]=false;

});




// 별

let star={

x:300,

y:200

};



function newStar(){

star.x=Math.random()*900+50;

star.y=Math.random()*400+50;

}




// 자원

let mineral={

x:700,

y:300

};



// 운석

let asteroid={

x:100,

y:100,

dx:4,

dy:3,

size:35

};



// 외계인

let alien={

x:800,

y:150,

hp:3

};



// 레이저

let lasers=[];



function laser(){


lasers.push({

x:ship.x,

y:ship.y-30

});


}



// 업데이트


function update(){



// 이동


if(keys["ArrowLeft"])

ship.x-=ship.speed;


if(keys["ArrowRight"])

ship.x+=ship.speed;


if(keys["ArrowUp"])

ship.y-=ship.speed;


if(keys["ArrowDown"])

ship.y+=ship.speed;




// 제한

ship.x=Math.max(20,Math.min(980,ship.x));

ship.y=Math.max(20,Math.min(630,ship.y));





// 운석 이동


asteroid.x+=asteroid.dx;

asteroid.y+=asteroid.dy;



if(asteroid.x<0||asteroid.x>1000)

asteroid.dx*=-1;


if(asteroid.y<0||asteroid.y>650)

asteroid.dy*=-1;




// 레이저 이동


lasers.forEach(l=>{

l.y-=10;

});




// 별 먹기


if(distance(ship,star)<40){

score++;

document.getElementById("score").innerHTML=score;

newStar();

}




// 자원 채굴


if(distance(ship,mineral)<50){

resource++;

document.getElementById("resource").innerHTML=resource;


mineral.x=Math.random()*900;

mineral.y=Math.random()*500;

}





// 운석 충돌


if(distance(ship,asteroid)<50){


ship.hp-=1;

document.getElementById("hp").innerHTML=ship.hp;


}





// 레이저와 외계인


lasers.forEach(l=>{


if(distance(l,alien)<40){


alien.hp--;


if(alien.hp<=0){


score+=10;

alien.x=Math.random()*900;

alien.y=Math.random()*400;

alien.hp=3;


}


}


});





}




function distance(a,b){


return Math.hypot(

a.x-b.x,

a.y-b.y

);


}





// 그리기


function draw(){


ctx.clearRect(0,0,1000,650);



// 별

ctx.fillStyle="yellow";

ctx.beginPath();

ctx.arc(star.x,star.y,12,0,Math.PI*2);

ctx.fill();




// 광물

ctx.fillStyle="lime";

ctx.fillRect(

mineral.x,

mineral.y,

25,

25

);




// 운석

ctx.fillStyle="gray";

ctx.beginPath();

ctx.arc(

asteroid.x,

asteroid.y,

35,

0,

Math.PI*2

);

ctx.fill();




// 외계인

ctx.fillStyle="purple";

ctx.beginPath();

ctx.arc(

alien.x,

alien.y,

25,

0,

Math.PI*2

);

ctx.fill();




// 우주선


ctx.fillStyle="cyan";

ctx.beginPath();


ctx.moveTo(ship.x,ship.y-30);

ctx.lineTo(ship.x-25,ship.y+25);

ctx.lineTo(ship.x+25,ship.y+25);


ctx.closePath();

ctx.fill();




// 레이저


ctx.fillStyle="red";


lasers.forEach(l=>{


ctx.fillRect(

l.x-3,

l.y,

6,

20

);


});



}



function loop(){


update();

draw();

requestAnimationFrame(loop);


}


newStar();

loop();



</script>


</body>

</html>
