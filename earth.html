<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SPACE EXPLORER</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;

    /* 세계지도 배경 */
    background-image:
    linear-gradient(
        rgba(0,0,0,0.35),
        rgba(0,0,0,0.55)
    ),
    url("worldmap.png");

    background-size:cover;
    background-position:center;

    color:white;
    font-family:Arial, sans-serif;
}


/* 위쪽 제목 */
.title{

    text-align:center;
    margin-top:80px;

    font-size:70px;
    font-weight:bold;

    text-shadow:
    0 0 20px cyan;

}


/* 메뉴 박스 */
.menu{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    text-align:center;

}


/* 버튼 */
button{

    width:300px;
    height:70px;

    margin:15px;

    border-radius:20px;

    border:2px solid cyan;

    background:
    rgba(0,0,0,0.6);

    color:white;

    font-size:25px;

    cursor:pointer;

    transition:0.3s;

}


button:hover{

    background:cyan;

    color:black;

    box-shadow:
    0 0 30px cyan;

}


/* 우주선 효과 */
.ship{

    position:absolute;

    bottom:50px;
    left:50%;

    transform:translateX(-50%);

    font-size:80px;

    animation:move 3s infinite alternate;

}


@keyframes move{

    from{
        transform:translateX(-50%) translateY(0);
    }

    to{
        transform:translateX(-50%) translateY(-30px);
    }

}


</style>

</head>


<body>


<h1 class="title">
🚀 SPACE EXPLORER
</h1>


<div class="menu">

<button onclick="location.href='main.html'">
게임 시작
</button>


<button onclick="location.href='guide.html'">
탐험 정보
</button>


</div>


<div class="ship">
🚀
</div>


</body>
</html>
