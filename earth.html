<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 지진 현황 지도 (USGS 연동)</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #f4f4f9;
        }

        /* 사이드바 스타일 */
        #sidebar {
            width: 360px;
            height: 100%;
            background: #ffffff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        .header {
            padding: 16px;
            background: #1a252f;
            color: #fff;
        }

        .header h2 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.8rem;
            color: #bdc3c7;
        }

        .eq-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .eq-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .eq-item:hover {
            background: #eef2f7;
            border-color: #cbd5e1;
        }

        .mag-badge {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .eq-info {
            flex: 1;
        }

        .eq-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 4px;
        }

        .eq-time {
            font-size: 0.75rem;
            color: #7f8c8d;
        }

        /* 지도 스타일 */
        #map {
            flex: 1;
            height: 100%;
        }

        /* 반응형 (모바일) */
        @media (max-width: 768px) {
            body {
                flex-direction: column-reverse;
            }
            #sidebar {
                width: 100%;
                height: 40%;
            }
            #map {
                height: 60%;
            }
        }
    </style>
</head>
<body>

    <!-- 좌측 목록 (사이드바) -->
    <div id="sidebar">
        <div class="header">
            <h2>USGS 실시간 지진 현황</h2>
            <p id="summary-info">최근 24시간 동안의 M2.5+ 지진</p>
        </div>
        <div class="eq-list" id="earthquake-list">
            <!-- JS로 항목 삽입됨 -->
        </div>
    </div>

    <!-- 우측 지도 영역 -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. 지도 초기화 (세계 지도 중심점)
        const map = L.map('map').setView([20, 0], 2);

        // 2. 배경 지도 타일 추가 (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors | Data: USGS'
        }).addTo(map);

        // 지진 규모별 색상 반환 함수
        function getColor(mag) {
            return mag >= 6.0 ? '#d32f2f' :
                   mag >= 5.0 ? '#f57c00' :
                   mag >= 4.0 ? '#fbc02d' :
                   mag >= 3.0 ? '#388e3c' : '#1976d2';
        }

        // 지진 마커 저장 객체
        const markers = {};

        // 3. USGS 실시간 GeoJSON 데이터 호출 (지난 24시간 규모 2.5 이상)
        const USGS_API_URL = 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson';

        fetch(USGS_API_URL)
            .then(response => response.json())
            .then(data => {
                const listContainer = document.getElementById('earthquake-list');
                const features = data.features;

                document.getElementById('summary-info').innerText = `최근 24시간 동안 ${features.length}건의 지진 발생`;

                features.forEach(eq => {
                    const props = eq.properties;
                    const coords = eq.geometry.coordinates; // [lng, lat, depth]
                    const lat = coords[1];
                    const lng = coords[0];
                    const mag = props.mag;
                    const place = props.place;
                    const time = new Date(props.time).toLocaleString('ko-KR');

                    // A. 지도에 원형 마커 생성
                    const marker = L.circleMarker([lat, lng], {
                        radius: Math.max(mag * 2.5, 4), // 규모에 따른 마커 크기
                        fillColor: getColor(mag),
                        color: '#ffffff',
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(map);

                    // 마커 팝업 설정
                    marker.bindPopup(`
                        <div style="font-size: 0.9rem;">
                            <strong style="color:${getColor(mag)}; font-size: 1.1rem;">M ${mag}</strong><br>
                            <b>위치:</b> ${place}<br>
                            <b>시간:</b> ${time}<br>
                            <b>깊이:</b> ${coords[2]} km
                        </div>
                    `);

                    markers[eq.id] = { marker, lat, lng };

                    // B. 좌측 사이드바 리스트 생성
                    const eqItem = document.createElement('div');
                    eqItem.className = 'eq-item';
                    eqItem.innerHTML = `
                        <div class="mag-badge" style="background-color: ${getColor(mag)};">
                            ${mag ? mag.toFixed(1) : 'N/A'}
                        </div>
                        <div class="eq-info">
                            <div class="eq-title">${place}</div>
                            <div class="eq-time">${time}</div>
                        </div>
                    `;

                    // 리스트 클릭 시 해당 지진 위치로 지도 이동 및 팝업 표시
                    eqItem.addEventListener('click', () => {
                        map.flyTo([lat, lng], 6, { duration: 1.5 });
                        marker.openPopup();
                    });

                    listContainer.appendChild(eqItem);
                });
            })
            .catch(error => {
                console.error('지진 데이터를 불러오는데 실패했습니다:', error);
            });
    </script>
</body>
</html>
