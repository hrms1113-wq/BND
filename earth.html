<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 지진 및 판의 경계 지도</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #f4f4f9;
        }

        /* 사이드바 스타일 */
        #sidebar {
            width: 360px;
            height: 100%;
            background: #ffffff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        .header {
            padding: 16px;
            background: #1a252f;
            color: #fff;
        }

        .header h2 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.8rem;
            color: #bdc3c7;
            margin-top: 2px;
        }

        .update-tag {
            display: inline-block;
            margin-top: 6px;
            padding: 2px 6px;
            background: #27ae60;
            color: #fff;
            font-size: 0.7rem;
            border-radius: 4px;
            font-weight: bold;
        }

        .eq-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .eq-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .eq-item:hover {
            background: #eef2f7;
            border-color: #cbd5e1;
        }

        .mag-badge {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .eq-info {
            flex: 1;
        }

        .eq-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 4px;
        }

        .eq-time {
            font-size: 0.75rem;
            color: #7f8c8d;
        }

        /* 지도 스타일 */
        #map {
            flex: 1;
            height: 100%;
        }

        /* 범례 스타일 */
        .legend {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 14px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            font-size: 0.8rem;
            line-height: 1.5;
            color: #333;
        }
        .legend-line {
            display: inline-block;
            width: 20px;
            height: 3px;
            background-color: #ff0000;
            margin-right: 6px;
            vertical-align: middle;
        }

        /* 반응형 (모바일) */
        @media (max-width: 768px) {
            body {
                flex-direction: column-reverse;
            }
            #sidebar {
                width: 100%;
                height: 40%;
            }
            #map {
                height: 60%;
            }
        }
    </style>
</head>
<body>

    <!-- 좌측 목록 (사이드바) -->
    <div id="sidebar">
        <div class="header">
            <h2>USGS 실시간 지진 현황</h2>
            <p id="summary-info">데이터 불러오는 중...</p>
            <div id="last-updated" class="update-tag">실시간 수신 중</div>
        </div>
        <div class="eq-list" id="earthquake-list">
            <!-- JS로 항목 삽입됨 -->
        </div>
    </div>

    <!-- 우측 지도 영역 -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. 지도 초기화 (세계 지도 중심점)
        const map = L.map('map').setView([20, 0], 2);

        // 2. 타일 레이어 추가
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors | Data: USGS, Hugo Ahlenius'
        }).addTo(map);

        // 3. 판의 경계(Tectonic Plates) 데이터 로드 및 시각화
        const PLATES_URL = 'https://raw.githubusercontent.com/fraxken/tectonicplates/master/GeoJSON/PB2002_boundaries.json';

        fetch(PLATES_URL)
            .then(response => response.json())
            .then(plateData => {
                L.geoJSON(plateData, {
                    style: {
                        color: '#e74c3c', // 이미지와 동일한 붉은색 선
                        weight: 2,
                        opacity: 0.85
                    }
                }).addTo(map);
            })
            .catch(err => console.error('판의 경계 데이터 불러오기 실패:', err));

        // 4. 범례(Legend) 추가
        const legend = L.control({ position: 'bottomright' });
        legend.onAdd = function () {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = '<div><span class="legend-line"></span><b>판의 경계 (Tectonic Plates)</b></div>';
            return div;
        };
        legend.addTo(map);

        // 규모별 색상 반환 함수
        function getColor(mag) {
            return mag >= 6.0 ? '#d32f2f' :
                   mag >= 5.0 ? '#f57c00' :
                   mag >= 4.0 ? '#fbc02d' :
                   mag >= 3.0 ? '#388e3c' : '#1976d2';
        }

        // 지진 마커 및 정보 관리 객체
        const markers = {};
        const USGS_API_URL = 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson';

        // 5. 지진 데이터 가져오는 함수
        function fetchEarthquakeData() {
            fetch(USGS_API_URL)
                .then(response => response.json())
                .then(data => {
                    const listContainer = document.getElementById('earthquake-list');
                    const features = data.features;

                    // 헤더 상태 갱신
                    document.getElementById('summary-info').innerText = `최근 24시간 동안 ${features.length}건의 지진 발생`;
                    const now = new Date().toLocaleTimeString('ko-KR');
                    document.getElementById('last-updated').innerText = `최근 갱신: ${now}`;

                    // 사이드바 목록 초기화
                    listContainer.innerHTML = '';

                    features.forEach(eq => {
                        const eqId = eq.id;
                        const props = eq.properties;
                        const coords = eq.geometry.coordinates; // [lng, lat, depth]
                        const lat = coords[1];
                        const lng = coords[0];
                        const mag = props.mag;
                        const place = props.place;
                        const time = new Date(props.time).toLocaleString('ko-KR');

                        // 마커가 없으면 새로 그려주고 기존에 있으면 그대로 유지
                        if (!markers[eqId]) {
                            const marker = L.circleMarker([lat, lng], {
                                radius: Math.max(mag * 2.5, 4),
                                fillColor: getColor(mag),
                                color: '#ffffff',
                                weight: 1,
                                opacity: 1,
                                fillOpacity: 0.8
                            }).addTo(map);

                            marker.bindPopup(`
                                <div style="font-size: 0.9rem;">
                                    <strong style="color:${getColor(mag)}; font-size: 1.1rem;">M ${mag}</strong><br>
                                    <b>위치:</b> ${place}<br>
                                    <b>시간:</b> ${time}<br>
                                    <b>깊이:</b> ${coords[2]} km
                                </div>
                            `);

                            markers[eqId] = marker;
                        }

                        // 사이드바 항목 생성
                        const eqItem = document.createElement('div');
                        eqItem.className = 'eq-item';
                        eqItem.innerHTML = `
                            <div class="mag-badge" style="background-color: ${getColor(mag)};">
                                ${mag ? mag.toFixed(1) : 'N/A'}
                            </div>
                            <div class="eq-info">
                                <div class="eq-title">${place}</div>
                                <div class="eq-time">${time}</div>
                            </div>
                        `;

                        eqItem.addEventListener('click', () => {
                            map.flyTo([lat, lng], 6, { duration: 1.5 });
                            markers[eqId].openPopup();
                        });

                        listContainer.appendChild(eqItem);
                    });
                })
                .catch(error => console.error('지진 데이터 업데이트 실패:', error));
        }

        // 최초 1회 실행
        fetchEarthquakeData();

        // 60초마다 실시간 지진 자동 업데이트
        setInterval(fetchEarthquakeData, 60000);
    </script>
</body>
</html>
