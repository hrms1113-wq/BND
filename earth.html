<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USGS 스타일 실시간 지진 지도</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #f4f4f9;
        }

        /* 사이드바 스타일 */
        #sidebar {
            width: 360px;
            height: 100%;
            background: #ffffff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        .header {
            padding: 16px;
            background: #1a252f;
            color: #fff;
        }

        .header h2 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.8rem;
            color: #bdc3c7;
            margin-top: 2px;
        }

        .update-tag {
            display: inline-block;
            margin-top: 6px;
            padding: 2px 6px;
            background: #27ae60;
            color: #fff;
            font-size: 0.7rem;
            border-radius: 4px;
            font-weight: bold;
        }

        .eq-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .eq-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .eq-item:hover {
            background: #eef2f7;
            border-color: #cbd5e1;
        }

        .mag-badge {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .eq-info {
            flex: 1;
        }

        .eq-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 4px;
        }

        .eq-time {
            font-size: 0.75rem;
            color: #7f8c8d;
        }

        /* 지도 스타일 */
        #map {
            flex: 1;
            height: 100%;
            background-color: #e5e5e5; /* USGS 백그라운드 색상 */
        }

        /* 반응형 (모바일) */
        @media (max-width: 768px) {
            body {
                flex-direction: column-reverse;
            }
            #sidebar {
                width: 100%;
                height: 40%;
            }
            #map {
                height: 60%;
            }
        }
    </style>
</head>
<body>

    <!-- 좌측 목록 (사이드바) -->
    <div id="sidebar">
        <div class="header">
            <h2>USGS 실시간 지진 현황</h2>
            <p id="summary-info">데이터 불러오는 중...</p>
            <div id="last-updated" class="update-tag">실시간 수신 중</div>
        </div>
        <div class="eq-list" id="earthquake-list">
            <!-- JS로 항목 삽입됨 -->
        </div>
    </div>

    <!-- 우측 지도 영역 -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. 지도 초기화 (USGS 기본 뷰포트)
        const map = L.map('map', {
            center: [20, 0],
            zoom: 2,
            minZoom: 2,
            maxZoom: 10
        });

        // 2. USGS 느낌의 회색톤 배경 타일 (CartoDB Positron No Labels)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // 3. 사진과 동일한 USGS 정밀 판 경계 데이터 (GeoJSON)
        const PLATES_URL = 'https://raw.githubusercontent.com/fraxken/tectonicplates/master/GeoJSON/PB2002_boundaries.json';

        fetch(PLATES_URL)
            .then(res => res.json())
            .then(plateData => {
                L.geoJSON(plateData, {
                    style: function(feature) {
                        // 사진처럼 선명한 붉은색 판 경계선 표현
                        return {
                            color: '#d32f2f',  // 빨간색
                            weight: 1.8,       // 선 두께
                            opacity: 0.9       // 투명도
                        };
                    }
                }).addTo(map);
            })
            .catch(err => console.error('판의 경계 로드 실패:', err));

        // 지진 규모별 색상 (USGS 표준 칼라)
        function getColor(mag) {
            return mag >= 6.0 ? '#bd0026' :
                   mag >= 5.0 ? '#f03b20' :
                   mag >= 4.0 ? '#fd8d3c' :
                   mag >= 3.0 ? '#feb24c' : '#fed976';
        }

        const markers = {};
        const USGS_API_URL = 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson';

        // 4. 실시간 지진 데이터 수신 함수
        function fetchEarthquakeData() {
            fetch(USGS_API_URL)
                .then(response => response.json())
                .then(data => {
                    const listContainer = document.getElementById('earthquake-list');
                    const features = data.features;

                    document.getElementById('summary-info').innerText = `최근 24시간 동안 ${features.length}건의 지진 발생`;
                    const now = new Date().toLocaleTimeString('ko-KR');
                    document.getElementById('last-updated').innerText = `최근 갱신: ${now}`;

                    listContainer.innerHTML = '';

                    features.forEach(eq => {
                        const eqId = eq.id;
                        const props = eq.properties;
                        const coords = eq.geometry.coordinates;
                        const lat = coords[1];
                        const lng = coords[0];
                        const mag = props.mag;
                        const place = props.place;
                        const time = new Date(props.time).toLocaleString('ko-KR');

                        // 지진 원형 마커 생성
                        if (!markers[eqId]) {
                            const marker = L.circleMarker([lat, lng], {
                                radius: Math.max(mag * 2.2, 3.5),
                                fillColor: getColor(mag),
                                color: '#e65100',
                                weight: 1,
                                opacity: 0.9,
                                fillOpacity: 0.85
                            }).addTo(map);

                            marker.bindPopup(`
                                <div style="font-size: 0.85rem;">
                                    <strong style="color:${getColor(mag)}; font-size: 1.05rem;">규모 ${mag}</strong><br>
                                    <b>위치:</b> ${place}<br>
                                    <b>시간:</b> ${time}<br>
                                    <b>깊이:</b> ${coords[2]} km
                                </div>
                            `);

                            markers[eqId] = marker;
                        }

                        // 목록 추가
                        const eqItem = document.createElement('div');
                        eqItem.className = 'eq-item';
                        eqItem.innerHTML = `
                            <div class="mag-badge" style="background-color: ${getColor(mag)};">
                                ${mag ? mag.toFixed(1) : 'N/A'}
                            </div>
                            <div class="eq-info">
                                <div class="eq-title">${place}</div>
                                <div class="eq-time">${time}</div>
                            </div>
                        `;

                        eqItem.addEventListener('click', () => {
                            map.flyTo([lat, lng], 6, { duration: 1.2 });
                            markers[eqId].openPopup();
                        });

                        listContainer.appendChild(eqItem);
                    });
                })
                .catch(error => console.error('지진 데이터 불러오기 오류:', error));
        }

        // 최초 1회 실행 및 60초 주기 자동 갱신
        fetchEarthquakeData();
        setInterval(fetchEarthquakeData, 60000);
    </script>
</body>
</html>
