<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>세계지도 배경</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #eaeaea; /* 바다 색상 (USGS 스타일 회색 배경) */
    overflow: hidden;
  }

  .map-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/a/ac/World_map_blank_without_borders.svg/1600px-World_map_blank_without_borders.svg.png');
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    z-index: -1;
  }

  /* 여기 안에 원하는 콘텐츠를 배치하세요 */
  .content {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

  <div class="map-background"></div>

  <div class="content">
    <!-- 이 안에 지도 위에 표시하고 싶은 요소(제목, 마커, 텍스트 등)를 추가하면 됩니다 -->
  </div>

</body>
</html>
