<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<title>SPACE GARAGE - Upgrade</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    height:100vh;

    background:
    radial-gradient(circle at center,#16345c,#020617,#000);

    font-family:Arial,sans-serif;

    color:white;

    overflow:hidden;

}



/* 별 */

.star{

    position:absolute;

    width:3px;

    height:3px;

    background:white;

    border-radius:50%;

}





.container{

    position:absolute;

    width:100%;

    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    padding-top:40px;

}





.title{

    font-size:55px;

    color:#70eaff;

    text-shadow:

    0 0 20px cyan;

}





.ship{

    margin-top:20px;

    font-size:90px;

}





.crystal{

    margin-top:20px;

    font-size:28px;

    color:#00ffff;

}





.upgradeBox{

    margin-top:30px;

    display:flex;

    gap:25px;

}





.card{

    width:260px;

    padding:25px;

    background:rgba(0,20,50,.8);

    border:2px solid cyan;

    border-radius:20px;

    text-align:center;

    box-shadow:

    0 0 20px rgba(0,255,255,.4);

}





.card h2{

    color:#70eaff;

}





.level{

    font-size:25px;

    margin:15px;

}





button{

    margin-top:20px;

    padding:12px 30px;

    border:none;

    border-radius:25px;

    cursor:pointer;

    background:#008cff;

    color:white;

    font-size:18px;

}





button:hover{

    transform:scale(1.1);

    box-shadow:0 0 20px cyan;

}





.home{

    margin-top:50px;

    background:#333;

}





.info{

    margin-top:10px;

    color:#aaa;

}


</style>


</head>


<body>



<script>

// 별 생성

for(let i=0;i<120;i++){

let star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"%";

star.style.top=Math.random()*100+"%";

document.body.appendChild(star);

}


</script>






<div class="container">



<div class="title">

🚀 SPACE GARAGE

</div>




<div class="ship">

🚀

</div>





<div class="crystal">

💎 보유 크리스탈 :

<span id="crystal">

</span>

</div>





<div class="upgradeBox">



<div class="card">


<h2>
🔫 LASER
</h2>


<div class="level">

LEVEL

<span id="laserLevel">

1

</span>

</div>


<p>

공격력 :

<span id="laserPower">

10

</span>

</p>


<p class="info" id="laserCost">

</p>


<button onclick="upgradeLaser()">

강화하기

</button>


</div>





<div class="card">


<h2>
🛡 SHIELD
</h2>


<div class="level">

LEVEL

<span id="shieldLevel">

1

</span>

</div>


<p>

방어력 :

<span id="shieldPower">

0

</span>

%

</p>


<p class="info" id="shieldCost">

</p>


<button onclick="upgradeShield()">

강화하기

</button>


</div>


<div class="card">


<h2>
🚀 ENGINE
</h2>


<div class="level">

LEVEL

<span id="engineLevel">

1

</span>

</div>


<p>

속도 :

<span id="enginePower">

7

</span>

</p>


<p class="info" id="engineCost">

</p>


<button onclick="upgradeEngine()">

강화하기

</button>


</div>



</div>







<button class="home" onclick="goHome()">

🏠 메인 화면으로

</button>




</div>









<script>


// ======================
// 데이터 불러오기
// ======================


let data={


crystal:

Number(localStorage.getItem("crystal")) || 500,


laser:

Number(localStorage.getItem("laser")) || 1,


shield:

Number(localStorage.getItem("shield")) || 1,


engine:

Number(localStorage.getItem("engine")) || 1



};







// ======================
// 업그레이드 비용
// ======================


const cost={



laser:[

0,

100,

250,

500,

900

],




shield:[

0,

120,

300,

600,

1000

],




engine:[

0,

100,

250,

550,

1100

]



};








// 저장


function save(){


localStorage.setItem(
"crystal",
data.crystal
);


localStorage.setItem(
"laser",
data.laser
);


localStorage.setItem(
"shield",
data.shield
);


localStorage.setItem(
"engine",
data.engine
);



}









// 화면 업데이트


function update(){



document.getElementById("crystal").innerHTML=
data.crystal;



document.getElementById("laserLevel").innerHTML=
data.laser;



document.getElementById("shieldLevel").innerHTML=
data.shield;



document.getElementById("engineLevel").innerHTML=
data.engine;






// 능력치


document.getElementById("laserPower").innerHTML=

data.laser*10;



document.getElementById("shieldPower").innerHTML=

(data.shield-1)*10;



document.getElementById("enginePower").innerHTML=

7+(data.engine-1)*2;








// 비용 표시


document.getElementById("laserCost").innerHTML=

getCost("laser");



document.getElementById("shieldCost").innerHTML=

getCost("shield");



document.getElementById("engineCost").innerHTML=

getCost("engine");



}









function getCost(type){


let lv=data[type];



if(lv>=5){

return "⭐ MAX LEVEL";

}



return "다음 강화 비용 💎 "+cost[type][lv];


}









// ======================
// 강화 함수
// ======================


function upgradeLaser(){

upgrade("laser");

}



function upgradeShield(){

upgrade("shield");

}



function upgradeEngine(){

upgrade("engine");

}







function upgrade(type){



if(data[type]>=5){


alert("최대 레벨입니다!");

return;


}





let price=cost[type][data[type]];






if(data.crystal>=price){



data.crystal-=price;



data[type]++;



save();


update();



}

else{


alert("크리스탈이 부족합니다!");

}



}










function goHome(){


location.href="main.html";


}







update();



</script>



</body>

</html>
