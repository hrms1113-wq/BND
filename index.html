<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Explorer : Galaxy Adventure</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    overflow:hidden;
    background:radial-gradient(circle at bottom,#162447,#0d1326,#02040d);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* 움직이는 별 */
.stars{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.2;transform:scale(1);}
    to{opacity:1;transform:scale(2);}
}

/* 떠다니는 행성 */
.planet{
    position:absolute;
    border-radius:50%;
    opacity:.85;
    animation:float 8s ease-in-out infinite;
}

.planet1{
    width:120px;
    height:120px;
    background:#3ea6ff;
    top:70px;
    left:80px;
}

.planet2{
    width:180px;
    height:180px;
    background:#ff8c42;
    right:70px;
    bottom:70px;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-20px);}
}

.menu{
    position:relative;
    z-index:2;
    width:700px;
    text-align:center;
    background:rgba(0,0,0,.45);
    border:2px solid #4dd8ff;
    border-radius:20px;
    padding:40px;
    box-shadow:0 0 30px rgba(77,216,255,.5);
    backdrop-filter:blur(6px);
}

h1{
    color:#6fe9ff;
    font-size:58px;
    text-shadow:0 0 20px cyan;
}

h2{
    color:white;
    margin-top:10px;
    font-weight:normal;
}

.features{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    background:rgba(255,255,255,.08);
    padding:18px;
    border-radius:12px;
    color:white;
    transition:.3s;
}

.card:hover{
    transform:scale(1.05);
    background:rgba(77,216,255,.2);
}

.buttons{
    margin-top:35px;
}

button{
    width:220px;
    padding:15px;
    margin:10px;
    font-size:20px;
    border:none;
    border-radius:40px;
    cursor:pointer;
    transition:.3s;
}

.start{
    background:#00bfff;
    color:white;
}

.start:hover{
    background:#00d5ff;
    transform:scale(1.08);
}

.setting{
    background:#3c3c3c;
    color:white;
}

.setting:hover{
    background:#5d5d5d;
}

footer{
    margin-top:30px;
    color:#bfbfbf;
    font-size:14px;
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="planet planet1"></div>
<div class="planet planet2"></div>

<div class="menu">

<h1>🚀 SPACE EXPLORER</h1>
<h2>Galaxy Adventure</h2>

<div class="features">

<div class="card">🌍 행성 탐험</div>

<div class="card">🚀 우주선 업그레이드</div>

<div class="card">⛏️ 자원 채굴</div>

<div class="card">👽 외계 생명체와 전투</div>

<div class="card">🌌 새로운 은하 발견</div>

<div class="card">🏆 최고의 우주 탐험가가 되세요!</div>

</div>

<div class="buttons">

<button class="start" onclick="startGame()">
▶ 게임 시작
</button>

<button class="setting">
⚙ 설정
</button>

</div>

<footer>
Version 1.0 • Space Explorer Project
</footer>

</div>

<script>

// 별 생성
const stars=document.getElementById("stars");

for(let i=0;i<200;i++){

    const star=document.createElement("div");
    star.className="star";

    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";

    star.style.animationDuration=(2+Math.random()*4)+"s";

    stars.appendChild(star);

}

// 시작 버튼
function startGame(){

    // 나중에 game.html로 변경
    alert("게임이 곧 시작됩니다!");

    // location.href="game.html";

}

</script>

</body>
</html>
