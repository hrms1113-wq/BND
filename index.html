<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPACE EXPLORER</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:'Segoe UI', sans-serif;
}


/* 우주 배경 */

.space{

    position:absolute;
    width:100%;
    height:100%;

    background:
    radial-gradient(circle at center,#162c55,#050817,#000);

}



/* 별 */

.star{

    position:absolute;
    background:white;
    border-radius:50%;

    animation:twinkle infinite alternate;

}


@keyframes twinkle{

    from{
        opacity:.2;
    }

    to{
        opacity:1;
    }

}



/* 오프닝 */

.intro{

    position:absolute;
    width:100%;
    height:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;

    font-size:35px;
    letter-spacing:5px;

    animation:introFade 5s forwards;

}


@keyframes introFade{

    0%{
        opacity:0;
    }

    30%{
        opacity:1;
    }

    70%{
        opacity:1;
    }

    100%{
        opacity:0;
    }

}



/* 우주선 */

.ship{

    position:absolute;

    left:-300px;
    top:45%;

    font-size:100px;

    animation:fly 4s forwards;

}


@keyframes fly{

    0%{
        left:-300px;
    }

    70%{
        left:45%;
    }

    100%{
        left:45%;
    }

}




/* 메인 화면 */

.main{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    text-align:center;

    color:white;

    opacity:0;

    animation:showMain 2s forwards;

    animation-delay:5s;

}



@keyframes showMain{

    to{
        opacity:1;
    }

}




.title{

    font-size:80px;

    color:#70eaff;

    text-shadow:
    0 0 15px cyan,
    0 0 40px cyan;

}



.sub{

    margin-top:20px;

    font-size:25px;

}




button{

    margin-top:50px;

    padding:18px 70px;

    border-radius:50px;

    border:none;

    cursor:pointer;

    font-size:22px;

    color:white;

    background:#008cff;

    box-shadow:0 0 20px cyan;

    transition:.3s;

}



button:hover{

    transform:scale(1.1);

    box-shadow:0 0 40px cyan;

}




.message{

    margin-top:25px;

    color:#aaa;

}



/* 제작자 */

.creator{

    position:absolute;

    bottom:25px;

    width:100%;

    text-align:center;

    color:#aaa;

    font-size:16px;

    letter-spacing:2px;

}


</style>

</head>


<body>


<div class="space" id="space"></div>



<div class="intro">

A NEW GALAXY AWAITS...

</div>




<div class="ship">

🚀

</div>




<div class="main">


<div class="title">

SPACE EXPLORER

</div>



<div class="sub">

GALAXY ADVENTURE

</div>



<button onclick="startGame()">

🚀 START MISSION

</button>



<div class="message">

미지의 은하가 당신을 기다립니다.

</div>



</div>



<div class="creator">

Created by 우다흰

</div>




<audio id="bgm" loop>

</audio>




<script>


// 별 생성

const space=document.getElementById("space");


for(let i=0;i<250;i++){


    let star=document.createElement("div");

    star.className="star";


    let size=Math.random()*3+1;


    star.style.width=size+"px";

    star.style.height=size+"px";


    star.style.left=Math.random()*100+"%";

    star.style.top=Math.random()*100+"%";


    star.style.animationDuration=

    (1+Math.random()*3)+"s";


    space.appendChild(star);


}





// 음악 시작

document.body.addEventListener("click",()=>{

    const bgm=document.getElementById("bgm");

    bgm.play();

});





// 메인 게임 연결

function startGame(){


    location.href="main.html";


}



</script>


</body>

</html>
