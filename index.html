<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPACE EXPLORER</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    overflow:hidden;
    background:#000;
}

/* 우주 배경 */
.space{
    position:fixed;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle at center,#162b5c 0%,#050816 45%,#000 100%);
}

/* 별 */
.star{
    position:absolute;
    background:white;
    border-radius:50%;
    animation:blink 2s infinite alternate;
}

@keyframes blink{
    from{opacity:.2;}
    to{opacity:1;}
}

/* 가운데 내용 */
.content{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    z-index:10;
}

.logo{
    font-size:75px;
    font-weight:bold;
    color:#73e9ff;
    letter-spacing:5px;
    text-shadow:
        0 0 10px cyan,
        0 0 20px cyan,
        0 0 40px cyan;
}

.subtitle{
    margin-top:15px;
    font-size:24px;
    color:#ddd;
    letter-spacing:2px;
}

.line{
    width:220px;
    height:3px;
    background:#73e9ff;
    margin:25px auto;
}

.start{
    margin-top:40px;
    padding:18px 60px;
    font-size:22px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    color:white;
    background:#009dff;
    transition:.3s;
}

.start:hover{
    transform:scale(1.08);
    box-shadow:0 0 25px cyan;
}

.press{
    margin-top:20px;
    color:#bbb;
    animation:fade 1.2s infinite alternate;
}

@keyframes fade{
    from{opacity:.3;}
    to{opacity:1;}
}

.version{
    position:absolute;
    bottom:20px;
    right:20px;
    color:#888;
    font-size:14px;
}
</style>
</head>

<body>

<div class="space" id="space"></div>

<div class="content">

<div class="logo">
SPACE EXPLORER
</div>

<div class="subtitle">
GALAXY ADVENTURE
</div>

<div class="line"></div>

<button class="start" onclick="startGame()">
게임 시작
</button>

<div class="press">
미지의 은하로 떠날 준비를 하세요...
</div>

</div>

<div class="version">
Version 1.0
</div>

<script>

// 별 생성
const space=document.getElementById("space");

for(let i=0;i<250;i++){

    const star=document.createElement("div");

    const size=Math.random()*3+1;

    star.className="star";
    star.style.width=size+"px";
    star.style.height=size+"px";
    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";
    star.style.animationDuration=(1+Math.random()*3)+"s";

    space.appendChild(star);

}

// 시작 버튼
function startGame(){

    // 실제 게임 연결
    // location.href="game.html";

    alert("게임을 시작합니다!");

}

</script>

</body>
</html>
